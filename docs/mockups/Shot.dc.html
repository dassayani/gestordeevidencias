<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="position:absolute;inset:0;background:#ffffff;display:flex;flex-direction:column;overflow:hidden">
  <div style="height:13%;min-height:16px;background:#EEF2F5;border-bottom:1px solid #DDE4E9;display:flex;align-items:center;gap:4%;padding:0 4%">
    <div style="display:flex;gap:4px">
      <div style="width:5px;height:5px;border-radius:50%;background:#C6D0D7"></div>
      <div style="width:5px;height:5px;border-radius:50%;background:#C6D0D7"></div>
      <div style="width:5px;height:5px;border-radius:50%;background:#C6D0D7"></div>
    </div>
    <div style="flex:1;height:45%;max-height:10px;border-radius:99px;background:#DFE6EB"></div>
  </div>
  <div style="flex:1;display:flex;min-height:0">
    <div style="width:20%;background:#F5F8FA;border-right:1px solid #E5EAEE;padding:4%;display:flex;flex-direction:column;gap:9%">
      <div style="height:6%;min-height:4px;border-radius:2px;background:#D5DEE4"></div>
      <div style="height:6%;min-height:4px;border-radius:2px;background:#E2E9ED"></div>
      <div style="height:6%;min-height:4px;border-radius:2px;background:#E2E9ED"></div>
      <div style="height:6%;min-height:4px;border-radius:2px;background:#E2E9ED"></div>
    </div>
    <div style="flex:1;padding:4%;display:flex;flex-direction:column;gap:6%;min-width:0">
      <div style="height:9%;min-height:6px;width:52%;border-radius:3px;background:#CBD6DD"></div>
      <div style="height:5%;min-height:4px;width:80%;border-radius:2px;background:#E6ECF0"></div>
      <div style="height:5%;min-height:4px;width:66%;border-radius:2px;background:#E6ECF0"></div>
      <div style="flex:1;display:flex;gap:5%;min-height:0">
        <div style="flex:1;border:1px solid #E4EAEE;border-radius:4px;background:#FAFCFD"></div>
        <div style="flex:1;border:1px solid #E4EAEE;border-radius:4px;background:#FAFCFD"></div>
      </div>
      <div style="display:flex;gap:5%;align-items:center">
        <div style="height:10px;width:26%;border-radius:3px;background:#D3DDE3"></div>
        <div style="height:10px;width:18%;border-radius:3px;background:#EAEFF2"></div>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:320,&quot;height&quot;:200}}"></script>
</body>
</html>
